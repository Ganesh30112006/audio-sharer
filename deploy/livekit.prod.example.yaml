# Production LiveKit sketch. Prefer LiveKit Cloud or the official Helm chart /
# deployment guide (https://docs.livekit.io/home/self-hosting/) for real deployments.
port: 7880
rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 60000
  use_external_ip: true
turn:
  # TURN is required for listeners behind restrictive NATs/firewalls (corporate, some mobile carriers).
  enabled: true
  domain: turn.example.com
  tls_port: 5349
  udp_port: 3478
  external_tls: true
keys:
  # Generate with: openssl rand -base64 48 — never commit real secrets.
  APIxxxxxxxxxxxx: ${LIVEKIT_API_SECRET}
room:
  empty_timeout: 300
  max_participants: 101
logging:
  level: info
