# Included in every location: nginx drops server-level add_header directives
# in any location that declares its own add_header.
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy no-referrer always;
add_header Permissions-Policy "camera=(), geolocation=(), microphone=(self), display-capture=(self), speaker-selection=(self)" always;
# Replace sfu.example.com with your LiveKit host (LIVEKIT_URL).
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self' blob:; connect-src 'self' wss://sfu.example.com https://sfu.example.com; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'" always;
