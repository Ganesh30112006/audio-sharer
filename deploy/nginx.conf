# Static SPA + reverse proxy for the control-plane API (no containers needed).
# HTTPS is required: capture, output selection and WebRTC need a secure context.
# Install: copy to /etc/nginx/sites-enabled/multiconnect.conf and
#          deploy/nginx-security-headers.conf to /etc/nginx/snippets/.
server {
  listen 443 ssl;
  http2 on;
  server_name audio.example.com;
  ssl_certificate     /etc/letsencrypt/live/audio.example.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/audio.example.com/privkey.pem;

  root /srv/multiconnect/frontend/dist;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  location /assets/ {
    include snippets/nginx-security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  location /api/ {
    include snippets/nginx-security-headers.conf;
    proxy_pass http://127.0.0.1:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    include snippets/nginx-security-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri /index.html;
  }
}

server {
  listen 80;
  server_name audio.example.com;
  return 301 https://$host$request_uri;
}
