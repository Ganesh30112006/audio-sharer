# CI / LAN testing: listen on all interfaces and advertise the host's real IP
# (pass --node-ip). Advertising only 127.0.0.1 fails ICE on newer Chromium.
port: 7880
rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 50100
  use_external_ip: false
keys:
  devkey: devsecret-not-for-production-0123456789
logging:
  level: info
