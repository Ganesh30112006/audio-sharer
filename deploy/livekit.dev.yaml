# Local development / CI LiveKit config. Do NOT use these keys in production.
port: 7880
bind_addresses:
  - 127.0.0.1
rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 50100
  use_external_ip: false
  node_ip: 127.0.0.1
keys:
  devkey: devsecret-not-for-production-0123456789
room:
  empty_timeout: 300
logging:
  level: warn
