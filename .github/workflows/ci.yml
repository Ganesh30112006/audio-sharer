name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - run: ruff check . && ruff format --check .
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run size

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    env:
      LIVEKIT_VERSION: '1.12.0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Start LiveKit SFU
        run: |
          curl -sSL "https://github.com/livekit/livekit/releases/download/v${LIVEKIT_VERSION}/livekit_${LIVEKIT_VERSION}_linux_amd64.tar.gz" | tar xz -C /tmp
          # Advertise the runner's real IP: newer Chromium fails ICE to a loopback-only candidate.
          /tmp/livekit-server --config deploy/livekit.ci.yaml --node-ip "$(hostname -I | awk '{print $1}')" > /tmp/livekit.log 2>&1 &
      - run: pip install -r backend/requirements.txt
      - working-directory: frontend
        run: npm ci && npx playwright install --with-deps chromium
      - working-directory: frontend
        # Correctness suites. Benchmarks (latency, perf, cpu, hires-throughput) are run
        # manually — see README "Performance measurements".
        run: npx playwright test e2e/streaming.spec.ts e2e/lossless.spec.ts e2e/harness.spec.ts
        env:
          LIFECYCLE_SOAK_SECONDS: '8'
      - if: failure()
        run: cat /tmp/livekit.log
